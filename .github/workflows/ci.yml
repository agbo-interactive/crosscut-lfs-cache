# ci-gate runs on PRs and in the merge queue (required check on master);
# the image is built and pushed to ECR on every push to master.
#
# Repository configuration required (Settings > Secrets and variables > Actions):
#   secrets.AWS_ACCESS_KEY_ID / secrets.AWS_SECRET_ACCESS_KEY
#     access keys for the GitHubActions-CROSSCUT IAM user (ECR push rights)
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: crosscut/crosscut-lfs-cache

permissions:
  contents: read

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./...

  push-image:
    needs: ci-gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker build -t "$IMAGE:${GITHUB_SHA::12}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"
